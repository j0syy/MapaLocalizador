<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <!-- Header -->
    <header class="container-fluid py-3 px-4 bg-white shadow-sm mb-4">
        <div class="row align-items-center g-3">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0"
                           placeholder="Buscar por usuario, IP, área o ID...">
                </div>
            </div>

            <div class="col-md-7 d-flex justify-content-md-end justify-content-between align-items-center gap-2">
                <div class="btn-group" role="group">
                    <button type="button" id="btnPlantaBaja" class="btn btn-dark active rounded-start-pill px-3">Planta Baja</button>
                    <button type="button" id="btnPlantaAlta" class="btn btn-outline-dark rounded-end-pill px-3">Planta Alta</button>
                </div>

                <button type="button" id="btnModoEdicion" class="btn btn-outline-primary rounded-pill px-3">
                    Modo Edición: <span id="lblModo">OFF</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container-fluid px-4">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">

            <!-- Mapa -->
            <div id="mapContainer" class="map-container position-relative">
                <img id="imgPlano" src="PlantaBaja.svg" alt="Plano" class="img-fluid w-100 rounded-3">
                <div id="layerPuntos" class="layer-puntos position-absolute top-0 start-0 w-100 h-100"></div>
            </div>

            <!-- Tarjeta de detalles (aparece a la derecha al hacer clic en un punto) -->
            <div id="panelEquipo" class="panel-equipo card border-0 shadow rounded-4 d-none">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold mb-0 text-dark">Detalles del equipo</h6>
                        <button type="button" id="btnCerrarPanel" class="btn-close" aria-label="Cerrar"></button>
                    </div>
                    <hr class="text-muted opacity-25 mt-0">
                    <div id="detallesContenido"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal de alta -->
    <div class="modal fade" id="modalEquipo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Registrar Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formEquipo">
                        <input type="hidden" id="eqX">
                        <input type="hidden" id="eqY">

                        <div class="mb-2">
                            <label class="form-label small fw-bold" for="eqId">ID Equipo</label>
                            <input type="text" id="eqId" class="form-control" placeholder="DESKTOP-SAT-01" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold" for="eqUsuario">Usuario</label>
                            <input type="text" id="eqUsuario" class="form-control" placeholder="Brenda Aguirre" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold" for="eqIP">IP</label>
                            <input type="text" id="eqIP" class="form-control" placeholder="192.168.1.100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="eqArea">Área</label>
                            <input type="text" id="eqArea" class="form-control" placeholder="Tecnología" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Guardar Equipo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
